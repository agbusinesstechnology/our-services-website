<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Virtual assistance, business services, lead generation, web development, ERP, automation and AI-powered technology solutions by Leba.">
  <meta name="robots" content="index, follow">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Leba | Business Support &amp; Technology Solutions">
  <meta property="og:description" content="Virtual assistance, business services and practical technology solutions for businesses.">
  <meta property="og:url" content="https://lebad280324.github.io/our-services-website/">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Leba | Business Support &amp; Technology Solutions">
  <meta name="twitter:description" content="Virtual assistance, business services and practical technology solutions for businesses.">
  <link id="canonical-link" rel="canonical" href="https://lebad280324.github.io/our-services-website/">
  <link rel="icon" href="./assets/images/favicon.png" type="image/png">
  <link rel="stylesheet" href="./assets/css/style.css">
  <title>Leba | Business Support &amp; Technology Solutions</title>
  <script src="./assets/js/content.js" defer></script>
  <script src="./assets/js/main.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>

  <header class="site-header">
    <nav class="nav container" aria-label="Primary navigation">
      <a class="brand" href="#top" aria-label="Leba home">
        <img class="brand-icon" src="./assets/images/favicon.png" alt="" width="48" height="48">
        <span class="brand-name" data-business-name>Leba</span>
      </a>
      <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="nav-menu">
        <span class="sr-only">Open navigation menu</span>
        <span></span><span></span><span></span>
      </button>
      <div class="nav-menu" id="nav-menu">
        <a href="#top" data-nav="home"></a>
        <a href="#about" data-nav="about"></a>
        <a href="#services" data-nav="services"></a>
        <a href="#expertise" data-nav="expertise"></a>
        <a href="#projects" data-nav="projects"></a>
        <a class="button button-small" href="#contact" data-nav="contact"></a>
      </div>
    </nav>
  </header>

  <main id="main-content">
    <section class="hero section" id="top" aria-labelledby="hero-title">
      <div class="container hero-layout">
        <div class="hero-copy reveal">
          <p class="eyebrow" id="hero-eyebrow"></p>
          <h1 id="hero-title"></h1>
          <p class="hero-positioning" id="hero-positioning"></p>
          <p class="hero-intro" id="hero-intro"></p>
          <div class="hero-actions">
            <a class="button" href="#services"><span id="hero-services-action"></span> <span aria-hidden="true">→</span></a>
            <a class="text-link" href="#projects"><span id="hero-projects-action"></span> <span aria-hidden="true">↓</span></a>
            <a class="text-link" href="#contact"><span id="hero-contact-action"></span> <span aria-hidden="true">↗</span></a>
          </div>
        </div>
        <div class="hero-panel reveal" aria-label="Our working approach">
          <p class="panel-kicker">Business thinking</p>
          <p class="panel-plus" aria-hidden="true">+</p>
          <p class="panel-kicker accent">Technical delivery</p>
          <div class="panel-rule"></div>
          <p class="panel-note" id="hero-note"></p>
        </div>
      </div>
    </section>

    <section class="section section-dark" id="services" aria-labelledby="services-title">
      <div class="container">
        <div class="section-heading services-heading reveal">
          <div>
            <p class="eyebrow" id="services-label"></p>
            <h2 id="services-title"></h2>
          </div>
          <p id="services-intro"></p>
        </div>
        <div class="services-grid" id="services-grid"></div>
      </div>
    </section>

    <section class="section section-light" id="about" aria-labelledby="about-title">
      <div class="container split-layout">
        <div class="section-heading reveal">
          <p class="eyebrow" id="about-label"></p>
          <h2 id="about-title"></h2>
        </div>
        <div class="about-body reveal" id="about-body"></div>
      </div>
    </section>

    <section class="section section-dark" id="expertise" aria-labelledby="expertise-title">
      <div class="container service-profiles">
        <div class="service-profile-intro reveal">
          <p class="eyebrow" id="expertise-label"></p>
          <h2 id="expertise-title"></h2>
          <p id="expertise-intro"></p>
        </div>
        <div id="service-profiles"></div>
      </div>
    </section>

    <section class="section" id="projects" aria-labelledby="projects-title">
      <div class="container">
        <div class="section-heading heading-row reveal">
          <div>
            <p class="eyebrow" id="projects-label"></p>
            <h2 id="projects-title"></h2>
          </div>
          <p id="projects-intro"></p>
        </div>
        <div class="projects-grid" id="projects-grid"></div>
      </div>
    </section>

    <section class="section section-light" id="team" aria-labelledby="team-title">
      <div class="container">
        <div class="section-heading centered reveal">
          <p class="eyebrow" id="team-label"></p>
          <h2 id="team-title"></h2>
          <p id="team-intro"></p>
        </div>
        <div class="team-grid" id="team-grid"></div>
      </div>
    </section>

    <section class="section process-section" id="how-we-work" aria-labelledby="process-title">
      <div class="container">
        <div class="section-heading centered reveal">
          <p class="eyebrow" id="process-label"></p>
          <h2 id="process-title"></h2>
        </div>
        <ol class="process-grid" id="process-grid"></ol>
      </div>
    </section>

    <section class="section contact-section" id="contact" aria-labelledby="contact-title">
      <div class="container contact-card reveal">
        <div>
          <p class="eyebrow" id="contact-label"></p>
          <h2 id="contact-title"></h2>
          <p id="contact-intro"></p>
        </div>
        <div class="contact-actions" id="contact-actions"></div>
        <p class="contact-location" id="contact-location"></p>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container footer-layout">
      <div>
        <a class="brand brand-footer" href="#top" aria-label="Leba home"><img class="brand-icon" src="./assets/images/favicon.png" alt="" width="48" height="48" loading="lazy"><span class="brand-name" data-business-name>Leba</span></a>
        <p id="footer-tagline"></p>
      </div>
      <div class="footer-links" id="social-links" aria-label="Social links"></div>
      <p class="copyright">© <span id="current-year"></span> <span data-business-name>Leba</span>. All rights reserved.</p>
    </div>
  </footer>

  <dialog class="project-dialog" id="project-dialog" aria-labelledby="dialog-title">
    <button class="dialog-close" type="button" aria-label="Close project details">×</button>
    <div class="dialog-content" id="dialog-content"></div>
  </dialog>

  <noscript><div class="noscript">Please enable JavaScript to view this website. All content is stored locally and no tracking scripts are used.</div></noscript>
</body>
</html>
